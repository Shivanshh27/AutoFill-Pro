<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFill Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div class="brand-text">
          <h1>AutoFill Pro</h1>
          <span class="badge" id="statusBadge">Active</span>
        </div>
      </div>
      <div class="header-actions">
        <label class="toggle-switch" title="Turn AutoFill Extension ON / OFF">
          <input type="checkbox" id="extensionToggle" checked>
          <span class="toggle-slider"></span>
        </label>
        <button id="openOptionsBtn" class="icon-btn" title="Open Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Active Profile Selector -->
    <div class="profile-selector-box">
      <label for="profileSelect" class="section-label">Active Profile</label>
      <div class="select-wrapper">
        <select id="profileSelect"></select>
        <div class="select-arrow">▾</div>
      </div>
    </div>

    <!-- Scan Status Card -->
    <div class="scan-card" id="scanCard">
      <div class="scan-info">
        <div class="status-indicator active" id="scanIndicator"></div>
        <div class="scan-text">
          <span class="scan-title" id="scanCountText">Scanning page...</span>
          <span class="scan-subtitle" id="scanDetails">Looking for job form inputs</span>
        </div>
      </div>
    </div>

    <!-- Main Action Button -->
    <button id="autofillBtn" class="primary-autofill-btn">
      <span class="btn-icon">⚡</span>
      <span class="btn-text">Autofill Application</span>
    </button>

    <div id="statusMessage" class="status-msg" style="display: none;"></div>

    <!-- Quick Copy Drawer -->
    <div class="quick-copy-section">
      <div class="section-header">
        <span class="section-label">📋 Fast Clipboard Copy</span>
      </div>
      <div class="copy-grid" id="quickCopyGrid">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Footer Stats & Links -->
    <footer class="footer">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-num" id="statForms">0</span>
          <span class="stat-name">Forms Filled</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num" id="statFields">0</span>
          <span class="stat-name">Fields Saved</span>
        </div>
      </div>
      <div class="shortcut-tip">
        <span>Shortcut: <code>Alt + Shift + F</code></span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
